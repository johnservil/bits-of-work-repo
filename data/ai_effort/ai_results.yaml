# AI mathematics results: primary-source compute disclosures vs third-party estimates.
# Collected 2026-10-09. Convention: {value, source_url} = disclosed by the primary source named;
# null = NOT disclosed (not "zero"). Third-party numbers appear ONLY under `estimates`.
# Raw page text: data/raw/ai_effort/ (see MANIFEST.md there for how each file was obtained).
# Per-attempt rows for the Erdos benchmarks: data/ai_effort/erdos_problems.csv
#
# Global caveats:
#  - "output_tokens"/"total_tokens": OpenAI reports output-only token counts (NS post). Input and cached-input tokens are undisclosed for every OpenAI item.
#  - Dollar figures that vendors state are NOT all on the same price basis (see each entry).
#  - Epoch blog (2026-09-01) and Epoch paper v1 (2026-09-06) disagree on several additional-attempt numbers; both recorded.

results:

- name: "FrontierMath Erdos benchmark, default configuration (5 models, 1 attempt x 68 conjectures)"
  lab: "Epoch AI (evaluator); models by OpenAI (GPT-6 Astra pre-release, GPT-5.6 Sol, GPT-5.5) and Anthropic (Claude Fable 5.1, Fable 5)"
  date: "2026-09-06 (arXiv v1; blog 2026-09-01)"
  problems: "68 conjectures covering 65 distinct Erdos problems (Hadwiger-Nelson #508 = 3 conjectures eq5/eq6/eq7; #713 = parts i, ii). IDs are listed in problems_list below."
  claim_status: "Lean-verified"   # Comparator-checked in Lean by Epoch; resolutions by GPT-6 Astra: #74 (disproof), #126 (proof)
  disclosed:
    output_tokens: null   # not reported; paper says costs were recomputed from token counts but never gives the counts
    total_tokens: null
    agents: null
    wall_clock_hours: {value: "15 h (#74), 16 h (#126) working time for the two resolutions; per-attempt limit 72 h", source_url: "https://arxiv.org/html/2609.25050 (Sec 3.4, Table 2)"}
    messages: null
    tpu_hours: null
    gpu_hours: null
    dollars: {value: "budget $300 and 72 h per attempt. Resolution costs at actual Astra prices: #74 $218, #126 $247 (paper Table 2). Benchmark-run total 'roughly $20,000' (paper Sec 4.2 fn 9; price basis unstated)", source_url: "https://arxiv.org/html/2609.25050 (Sec 3.4, 4.1, 4.2)"}
    hours_of_thinking: null
    attempts: {value: 340, source_url: "https://arxiv.org/html/2609.25050 (Sec 4.1: 5 models x 68 conjectures, one attempt each; 340 is my product, not stated)"}
    successes: {value: "GPT-6 Astra 2/68 (3%); GPT-5.6 Sol 0; GPT-5.5 0; Claude Fable 5.1 0; Claude Fable 5 0", source_url: "https://arxiv.org/html/2609.25050 (Table 1)"}
  estimates:
    - {value: 10000, unit: "USD per resolution (expected cost = $300 per attempt / 3% success rate)", who: "Epoch authors (Adamczewski, Bloom), paper Sec 5", source_url: "https://arxiv.org/html/2609.25050"}
    - {value: "37000-39000", unit: "USD, Astra benchmark run at actual prices (MY ARITHMETIC, not a source claim): 66 limit-hitting attempts x $545-572 per paper fn 8, plus $218+$247", who: "this extraction (derived; treat as unverified)", source_url: "https://arxiv.org/html/2609.25050 (fn 8)"}
  primary_source_url: "https://arxiv.org/abs/2609.25050"
  secondary_sources: ["https://epoch.ai/latest/announcing-frontiermath-erdos", "https://epoch.ai/benchmarks/frontiermath-erdos"]
  notes: >
    Pricing caveat (paper fn 8): Astra was pre-release, so the harness metered spend at GPT-5.6 Sol per-token prices as a stand-in.
    Astra's actual prices are ~1.8-2.0x higher; attempts that hit the metered $300 cap really spent $545-572.
    Epoch recomputed all Astra costs at actual prices and counted a resolution only if <= $300 actual. This removed #1
    (disproved at $405 actual cost / 27 h) from the benchmark score. The agent's budget tool showed metered dollars, so the
    model believed it had ~$140 left when it had actually spent $300: behavior may differ under true budget display.
    The 'roughly $20,000 for the benchmark run' figure is ambiguous: 68 x $300 metered = $20,400, which suggests it is on the
    metered (Sol-price) basis, in which case actual Astra spend would be nearly double. Not resolved by the paper.
    Per-attempt cost/time for the 66 unresolved Astra attempts and all 272 attempts by the other four models are NOT disclosed
    (only 'ran out of budget'). CSV rows for these have cost_usd/hours blank.
    DISCREPANCY: the blog says #74 cost $222 / ~10 h and #126 cost $172 / ~10 h; the paper (v1, 6 Sep) says #74 $218 / 15 h and #126 $247 / 16 h. Paper numbers used in the CSV.
    problems_list (benchmark conjecture IDs, erdosproblems.com numbering): 1, 3, 5, 7, 20, 23, 28, 30, 39, 41, 52, 61, 66, 68, 74, 86, 89, 97, 101, 104, 107, 120, 126, 128, 138, 172, 181, 184, 208.parts.i, 213, 241, 242, 322, 324, 364, 371, 376, 406, 431, 478, 508.eq5, 508.eq6, 508.eq7, 548, 564, 571, 583, 595, 647, 672, 713.parts.i, 713.parts.ii, 714, 723, 773, 812.parts.i, 821, 829, 952, 970, 972, 975, 1003, 1020, 1057, 1083, 1159, 1206.parts.i

