    LLM cost computed from standard Gemini API list prices (input excl. cached, cache-read, output incl. thoughts), prompts <=200k tokens rate.
    The paper explicitly states the reported costs 'do not capture the full cost of discovery': running agent D on all 353 problems 'was itself a significant computational investment'; NO sweep total is given (null).
    Costs quoted are for successful runs (box plots of successful runs in App B); failed-run costs on the 344 unsolved statements are undisclosed.
    Paper states USD is not intended as a comparison of AI and human labour.
    Success numbers (9/353) count statements incl. variants; Epoch's reading: 4 unambiguous resolutions (#152, #846, #125, #26 variant), #741 marked solved on erdosproblems.com with interpretation caveat, #12 and #138 only partial/variant and remain open.

