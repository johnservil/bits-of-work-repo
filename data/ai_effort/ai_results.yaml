    - {value: "roughly 10 million", unit: "USD", who: "BBC, cited by a news aggregator in a search-tool summary only; UNVERIFIED", source_url: "https://www.etvbharat.com/en/technology/openai-millennium-prize-math-problem-navier-stokes-problem-clay-mathematics-institute-enn26090901712"}
