    agents: {value: "full-featured agent D: 10 subagents per attempt; 10 attempts per problem for agents C and D; basic agents A/B: 100 independent single-subagent attempts per problem", source_url: "https://arxiv.org/html/2605.22763v1 (Sec 5)"}
    wall_clock_hours: {value: "cut-off 48 h for all comparison experiments; basic-agent additional runs 24 h budget; per-problem times only in figures", source_url: "https://arxiv.org/html/2605.22763v1 (App B.3, Fig 11)"}
