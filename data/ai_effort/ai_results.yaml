    tpu_hours: {value: "AlphaProof ~27.5 TPU-hours (v6e) per problem; standalone AlphaProof baseline budget ~64 v6e TPU-hours per problem (solved 0 of 9)", source_url: "https://arxiv.org/html/2605.22763v1 (Sec 5 'Cost and Variance'; App B.3)"}
    gpu_hours: null
    dollars: {value: "AlphaProof ~ $60 per problem (27.5 TPU-h). LLM inference 'a few hundred dollars per problem' (abstract). No total sweep cost. Fig 3 caption: accounting for the $60 AlphaProof cost does not change conclusions", source_url: "https://arxiv.org/html/2605.22763v1 (abstract, Sec 5)"}
    hours_of_thinking: null
    attempts: {value: "353 problems attempted with agent D, each terminated if no proof within 3000 episodes; AlphaProof sub-calls capped at ~400 simulations (plus RPC timeout), max 5 AlphaProof queries and 90 search-replace edits per episode", source_url: "https://arxiv.org/html/2605.22763v1 (Sec 3, App A)"}
    successes: {value: "9/353 statements (agent D); basic agent A solved all 9 post hoc at higher cost on the hardest; Gemini 3.0 Flash / 3.1 Flash-Lite basic agents and standalone AlphaProof solved 0 of the 9", source_url: "https://arxiv.org/html/2605.22763v1 (Sec 1, Sec 5, App B.3)"}
