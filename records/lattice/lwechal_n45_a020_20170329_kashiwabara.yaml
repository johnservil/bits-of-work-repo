notes: "Darmstadt LWE Challenge: search-LWE with uniform secret, m=n^2 samples, q = prime near n^2 (toy file n=10 has q=101, m=100), Gaussian error sigma = alpha*q; instances generated by MPC (TU/e, UCSD, TUD). Each (n, alpha) cell is solved once, so every entry is a cell record. On the solved-region Pareto frontier at solve time. Error norm 1849.8359386713. Solver note (abridged): SVP algorithm is based on RSR algorithm developed by Kenji KASHIWABARA, Masaharu FUKASE and Tadanori TERUYA. In embedding, we use m=145 and. 864 cores per job; embedding m=145."
