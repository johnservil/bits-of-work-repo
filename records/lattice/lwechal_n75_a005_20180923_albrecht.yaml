notes: "Darmstadt LWE Challenge: search-LWE with uniform secret, m=n^2 samples, q = prime near n^2 (toy file n=10 has q=101, m=100), Gaussian error sigma = alpha*q; instances generated by MPC (TU/e, UCSD, TUD). Each (n, alpha) cell is solved once, so every entry is a cell record. On the solved-region Pareto frontier at solve time. Error norm 2092.6753212097. Solver note (abridged): Completed using the G6K sieving framework.\\\\This challenge was completed in the preliminary stages of algorithm design and no timing informa. no timing recorded (preliminary algorithm stage); ePrint 2019/089 highlights this solve."
