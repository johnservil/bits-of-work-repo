notes: "Original TU Darmstadt Lattice Challenge (Buchmann-Lindner-Rueckert-Schneider, PQCrypto 2008): Ajtai-type q-ary lattices; goal is any lattice vector with Euclidean norm below a stated bound n (smaller than lattice dim m). Approx-SVP / SIS-type short vector, not exact SVP. Record progression entry (new max dimension), ordered by HoF submission id 11. HoF norm 83.35. HoF gives no date for early entries; dated as upper bound: a Wayback capture of 2008-12-02 already lists Gama-Nguyen at dims 675-725. No resource statement on HoF/details page."
