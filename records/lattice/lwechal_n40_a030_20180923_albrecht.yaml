notes: "Darmstadt LWE Challenge: search-LWE with uniform secret, m=n^2 samples, q = prime near n^2 (toy file n=10 has q=101, m=100), Gaussian error sigma = alpha*q; instances generated by MPC (TU/e, UCSD, TUD). Each (n, alpha) cell is solved once, so every entry is a cell record. On the solved-region Pareto frontier at solve time. Error norm 1875.4948680282. Solver note (abridged): Completed using the G6K sieving framework.\\\\Part of the timing information for this was lost due to programming error. That which remains re. part of timing lost per solvers; under a week."
